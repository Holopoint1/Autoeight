<!DOCTYPE html><html lang="en"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Staff Portal — Autoeight</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="/admin/admin.css?v=3"></head> <body>   <div class="login-wrap"> <div class="login-card"> <div class="login-logo"> <img src="/brand_assets/logo.png?v=3" alt="Autoeight"> <div class="login-badge-pill">Staff Portal</div> </div> <h2>Welcome back</h2> <p class="login-sub">Enter your staff password to access the sales portal.</p> <div class="login-err" id="login-err"> <i class="fa-solid fa-circle-exclamation"></i> Incorrect password. Please try again.
</div> <form id="login-form" onsubmit="handleLogin(event)"> <label class="login-label" for="pw">Password</label> <input type="password" id="pw" class="login-input" placeholder="Enter staff password" autocomplete="current-password"> <button type="submit" class="btn-login"> <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
</button> </form> <p class="login-note">This portal is for authorised Autoeight staff only.</p> </div> </div> <script src="/admin/auth.js?v=unified"></script> <script>
    // Where should we go after signing in? The page that sent us here
    // will have stashed its path. Default to the dashboard.
    function nextUrl() {
      var next = sessionStorage.getItem('ae_login_next');
      if (next && next.indexOf('/admin') === 0) {
        sessionStorage.removeItem('ae_login_next');
        return next;
      }
      return '/admin';
    }

    // Already logged in AND have the chat password stored? Skip to the
    // originally-requested page (or dashboard if none). Otherwise show
    // the form so the user can re-enter and get both keys saved.
    if (sessionStorage.getItem('ae_staff') === '1' && sessionStorage.getItem('ae_chat_admin_pw')) {
      window.location.href = nextUrl();
    }

    async function handleLogin(e) {
      e.preventDefault();
      var pwInput = document.getElementById('pw');
      var err     = document.getElementById('login-err');
      var btn     = document.querySelector('.btn-login');
      var pw      = pwInput.value;
      err.classList.remove('show');
      err.textContent = '';

      if (!pw) {
        err.textContent = 'Please enter a password.';
        err.classList.add('show');
        pwInput.focus();
        return;
      }

      if (typeof window.AEAuth === 'undefined' || typeof AEAuth.login !== 'function') {
        err.textContent = 'Login script failed to load. Hard refresh the page (Ctrl+Shift+R).';
        err.classList.add('show');
        return;
      }

      var originalLabel = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in…';

      try {
        var ok = await AEAuth.login(pw);
        if (ok) {
          window.location.href = nextUrl();
          return;
        }
        err.textContent = 'Wrong password. Check the ADMIN_PASSWORD secret in Supabase.';
        err.classList.add('show');
      } catch (e) {
        err.textContent = 'Could not reach the server: ' + (e.message || 'unknown error');
        err.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalLabel;
        pwInput.value = '';
        pwInput.focus();
      }
    }
  </script>   </body> </html>
