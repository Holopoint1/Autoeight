<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Staff Portal — Autoeight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/admin/admin.css?v=3" />
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">

      <div class="login-logo">
        <img src="/brand_assets/logo.png?v=3" alt="Autoeight" />
        <div class="login-badge-pill">Staff Portal</div>
      </div>

      <h2>Welcome back</h2>
      <p class="login-sub">Enter your staff password to access the sales portal.</p>

      <div class="login-err" id="login-err">
        <i class="fa-solid fa-circle-exclamation"></i> Incorrect password. Please try again.
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <label class="login-label" for="pw">Password</label>
        <input type="password" id="pw" class="login-input" placeholder="Enter staff password" autocomplete="current-password" />
        <button type="submit" class="btn-login">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
        </button>
      </form>

      <p class="login-note">This portal is for authorised Autoeight staff only.</p>
    </div>
  </div>

  <script src="/admin/auth.js"></script>
  <script>
    // Already logged in? Skip to dashboard
    if (sessionStorage.getItem('ae_staff') === '1') {
      window.location.href = '/admin';
    }

    async function handleLogin(e) {
      e.preventDefault();
      var pw  = document.getElementById('pw').value;
      var err = document.getElementById('login-err');
      var ok = await AEAuth.login(pw);
      if (ok) {
        window.location.href = '/admin';
      } else {
        err.classList.add('show');
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }
  </script>


</body>
</html>
