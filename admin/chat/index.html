<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#6d4de6" />
<link rel="manifest" href="/admin/chat/manifest.json" />
<link rel="apple-touch-icon" href="/brand_assets/logo.png" />
<title>Chat Admin — Autoeight</title>
<style>
:root {
  --font-scale: 1;
  --purple: #7c5cfc;
  --purple-dark: #6d4de6;
  --green: #4ade80;
  --amber: #fbbf24;
  --red: #f87171;
}
html[data-theme="dark"] {
  --bg: #0d0d14;
  --panel: #15151f;
  --panel-hover: #1c1c28;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.14);
  --text: #ffffff;
  --text-soft: rgba(255,255,255,0.88);
  --muted: rgba(255,255,255,0.62);
  --input-bg: rgba(255,255,255,0.06);
  --you-bg: rgba(124,92,252,0.22);
  --you-border: rgba(124,92,252,0.32);
}
html[data-theme="light"] {
  --bg: #f6f6fa;
  --panel: #ffffff;
  --panel-hover: #f0f0f5;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.14);
  --text: #121221;
  --text-soft: #2b2b3d;
  --muted: #6b6b7c;
  --input-bg: #ffffff;
  --you-bg: rgba(124,92,252,0.12);
  --you-border: rgba(124,92,252,0.28);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text);
  height: 100dvh; overflow: hidden;
  font-size: calc(1rem * var(--font-scale));
  -webkit-font-smoothing: antialiased;
  transition: background 0.2s, color 0.2s;
}
.login {
  height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.login-card {
  width: 100%; max-width: 360px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
}
.login-card h1 { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }
.login-card input {
  width: 100%; padding: 11px 14px; margin-bottom: 10px;
  background: var(--input-bg); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.9rem;
  outline: none;
}
.login-card input:focus { border-color: var(--purple); }
.login-card button {
  width: 100%; padding: 12px; margin-top: 8px;
  background: linear-gradient(135deg, var(--purple), var(--purple-dark));
  border: 0; border-radius: 10px; color: #fff;
  font-family: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer;
}
.login-card .error { color: var(--red); font-size: 0.82rem; margin-top: 10px; }

.app { display: none; height: 100dvh; flex-direction: column; }
.app.active { display: flex; }

/* ── Admin nav strip across the top ── */
.admin-nav {
  display: flex; align-items: center; gap: 4px;
  padding: 8px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  flex-shrink: 0;
}
.admin-nav::-webkit-scrollbar { display: none; }
.admin-nav a {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  color: var(--muted);
  font-size: 0.74rem; font-weight: 500;
  text-decoration: none;
  border-radius: 7px;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
.admin-nav a:hover { background: var(--panel-hover); color: var(--text); }
.admin-nav a.active { background: rgba(124,92,252,0.15); color: var(--purple); }
.admin-nav .spacer { flex: 1; }
.admin-nav .sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }
.admin-nav .nav-tool {
  padding: 5px 9px;
  background: transparent; border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted); cursor: pointer;
  font-family: inherit; font-size: 0.72rem; font-weight: 600;
  white-space: nowrap;
}
.admin-nav .nav-tool:hover { background: var(--panel-hover); color: var(--text); border-color: var(--border-strong); }

.app-body { flex: 1; display: flex; min-height: 0; }

/* ── Sidebar (conversation list) ── */
.sidebar {
  width: 340px; max-width: 100%; flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-header h1 { font-size: 1rem; font-weight: 700; }
.sidebar-header .refresh {
  background: var(--panel-hover); border: 1px solid var(--border);
  color: var(--muted); padding: 6px 10px; border-radius: 8px;
  font-size: 0.72rem; cursor: pointer;
}
.filter-tabs {
  display: flex; padding: 10px; gap: 6px;
  border-bottom: 1px solid var(--border);
}
.filter-tabs button {
  flex: 1; padding: 6px; border-radius: 7px;
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); cursor: pointer;
  font-family: inherit; font-size: 0.72rem;
}
.filter-tabs button.active { background: var(--purple); color: #fff; border-color: var(--purple); }

.convo-list { flex: 1; overflow-y: auto; }
.convo-item {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  display: flex; flex-direction: column; gap: 2px;
  position: relative;
}
.convo-item:hover { background: var(--panel-hover); }
.convo-item.active { background: rgba(124,92,252,0.15); }
.convo-item .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.convo-item .name { font-size: 0.82rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.convo-item .time { font-size: 0.66rem; color: var(--muted); flex-shrink: 0; }
.convo-item .preview { font-size: 0.72rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.convo-item .status {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.62rem; font-weight: 600; padding: 1px 7px; border-radius: 999px;
  margin-top: 2px; width: fit-content;
}
.convo-item .dot-unread {
  position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
  width: 6px; height: 6px; border-radius: 50%; background: var(--purple);
}
.status.ai { background: rgba(124,92,252,0.15); color: var(--purple); }
.status.waiting_human { background: rgba(251,191,36,0.18); color: var(--amber); }
.status.human_active { background: rgba(74,222,128,0.15); color: var(--green); }
.status.closed { background: var(--panel-hover); color: var(--muted); }

/* ── Main (conversation view) ── */
.main {
  flex: 1; display: flex; flex-direction: column;
  min-width: 0;
}
.chat-header {
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--panel);
}
.chat-header .back { display: none; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px; }
.chat-header .info { min-width: 0; flex: 1; }
.chat-header .info h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-header .info p { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-header .actions { display: flex; gap: 6px; }
.chat-header .actions button {
  background: var(--panel-hover); border: 1px solid var(--border);
  color: var(--muted); padding: 7px 12px; border-radius: 8px;
  font-size: 0.72rem; cursor: pointer;
}

.chat-body {
  flex: 1; overflow-y: auto;
  padding: 24px 0 16px;
  background: var(--bg);
}
.chat-scroll {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex; flex-direction: column; gap: 2px;
}
.msg {
  padding: 10px 14px;
  font-size: 0.92rem;
  line-height: 1.55;
  word-wrap: break-word;
  white-space: pre-wrap;
  border-radius: 12px;
  max-width: 82%;
}
.msg.user {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
}
.msg.assistant {
  align-self: flex-start;
  background: transparent;
  color: var(--muted);
  padding-left: 0;
  font-style: italic;
  font-size: 0.85rem;
}
.msg.human {
  align-self: flex-end;
  background: var(--you-bg);
  border: 1px solid var(--you-border);
  color: var(--text);
}
.msg-meta {
  font-size: 0.66rem; color: var(--muted);
  margin-top: 2px; opacity: 0.6;
  padding: 0 4px;
}
.msg.user .msg-meta, .msg.assistant .msg-meta { text-align: left; }
.msg.human .msg-meta { text-align: right; }

/* Role label above grouped messages */
.role-label {
  font-size: 0.68rem; font-weight: 600;
  color: var(--muted); margin: 14px 0 4px;
  padding: 0 14px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.role-label.user { align-self: flex-start; padding-left: 0; color: var(--purple); }
.role-label.human { align-self: flex-end; padding-right: 4px; color: var(--green); }
.role-label.assistant { align-self: flex-start; padding-left: 0; color: var(--muted); }

/* Group consecutive messages */
.msg + .msg { margin-top: 4px; }

/* ── Right-click context menu ── */
.ctx-menu {
  position: fixed; z-index: 100;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px;
  min-width: 180px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  display: none;
}
.ctx-menu.active { display: block; }
.ctx-menu button {
  display: block; width: 100%; text-align: left;
  padding: 8px 12px; border-radius: 6px;
  background: transparent; border: 0;
  color: var(--text); cursor: pointer;
  font-family: inherit; font-size: 0.84rem;
}
.ctx-menu button:hover { background: var(--panel-hover); }
.ctx-menu button.danger { color: var(--red); }
.ctx-menu button.danger:hover { background: rgba(248,113,113,0.1); }

.empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 0.88rem; text-align: center; padding: 40px; }

.reply-wrap {
  padding: 14px 16px; background: var(--panel);
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: flex-end;
}
.reply-wrap textarea {
  flex: 1; padding: 10px 14px; min-height: 42px; max-height: 140px;
  background: var(--input-bg); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text);
  font-family: inherit; font-size: 0.88rem; line-height: 1.4;
  resize: none; outline: none;
}
.reply-wrap textarea:focus { border-color: var(--purple); }
.reply-wrap button {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--purple-dark));
  border: 0; color: #fff; cursor: pointer; font-size: 1rem; flex-shrink: 0;
}
.reply-wrap button:disabled { opacity: 0.4; }
.reply-wrap .attach-btn {
  background: var(--panel-hover); color: var(--muted);
}
.reply-wrap .attach-btn:hover { background: rgba(124,92,252,0.15); color: var(--purple); }

.msg .attach-link {
  display: flex; align-items: center; gap: 8px;
  margin-top: 6px; padding: 8px 10px;
  background: var(--panel-hover);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: inherit; text-decoration: none;
  font-size: 0.78rem;
}
.msg.human .attach-link { background: var(--input-bg); }
.msg .attach-img {
  display: block; max-width: 100%; max-height: 260px;
  border-radius: 8px; margin-top: 6px;
}

@media (max-width: 768px) {
  .app.active { flex-direction: row; }
  .sidebar { width: 100%; position: absolute; inset: 0; z-index: 10; }
  .main { width: 100%; position: absolute; inset: 0; z-index: 5; display: none; }
  .app.view-chat .sidebar { display: none; }
  .app.view-chat .main { display: flex; z-index: 20; }
  .chat-header .back { display: block; }
}
</style>
</head>

    document.documentElement.setAttribute('data-theme', theme);

    document.documentElement.style.setProperty('--font-scale', scale);

</script>
<script src="/admin/auth.js"></script>

<script>
// Admin panel — talks to the chat edge function with a password
const CHAT_ENDPOINT = 'https://useohuvyxzshmskjngpo.supabase.co/functions/v1/chat';
const TOKEN_KEY = 'ae_chat_admin_pw';

// Use the shared staff password from auth.js (stored by the unified login page)
let adminPassword = (window.AEAuth && AEAuth.getPassword()) || sessionStorage.getItem(TOKEN_KEY) || '';
let conversations = [];
let currentConvId = null;
let currentFilter = 'all';
let pollTimer = null;
const READ_KEY = 'ae_chat_read_state'; // { [conversationId]: lastReadISO }
function readState() {
  try { return JSON.parse(localStorage.getItem(READ_KEY) || '{}'); } catch (e) { return {}; }
}
function markRead(id, ts) {
  const s = readState(); s[id] = ts || new Date().toISOString();
  localStorage.setItem(READ_KEY, JSON.stringify(s));
}

const $ = (id) => document.getElementById(id);

async function rpc(payload) {
  const res = await fetch(CHAT_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...payload, password: adminPassword }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// ── Login flow ──
async function tryLogin() {
  const pw = $('admin-token').value.trim();
  if (!pw) return;
  adminPassword = pw;
  try {
    await rpc({ action: 'admin_login' });
    sessionStorage.setItem(TOKEN_KEY, pw);
    $('login').style.display = 'none';
    $('app').classList.add('active');
    await loadConversations();
    startPolling();
  } catch (e) {
    $('login-error').textContent = 'Wrong password or connection error.';
    $('login-error').style.display = 'block';
  }
}

$('login-btn').addEventListener('click', tryLogin);
$('admin-token').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });

if (adminPassword) {
  // Silently validate the shared password; if it works, skip the login card entirely
  (async () => {
    try {
      await rpc({ action: 'admin_login' });
      sessionStorage.setItem(TOKEN_KEY, adminPassword);
      $('login').style.display = 'none';
      $('app').classList.add('active');
      await loadConversations();
      startPolling();
    } catch (e) {
      // Password was wrong or expired — fall back to login page
      window.location.href = '/admin/login';
    }
  })();
}

// ── Load conversations ──
async function loadConversations() {
  try {
    const data = await rpc({ action: 'admin_list' });
    conversations = data.conversations || [];
    renderConvoList();
  } catch (e) {
    console.error(e);
  }
}

function renderConvoList() {
  const list = $('convo-list');
  const filtered = currentFilter === 'all' ? conversations : conversations.filter((c) => c.status === currentFilter);
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:40px 20px;">No conversations yet</div>';
    return;
  }
  const rs = readState();
  list.innerHTML = filtered.map((c) => {
    const name = c.visitor_name || (c.visitor_email ? c.visitor_email : 'Anonymous');
    const time = new Date(c.last_message_at).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
    const page = c.page_url ? new URL(c.page_url).pathname : '';
    const preview = c.visitor_company ? `${c.visitor_company} · ${page || 'chat'}` : (page || 'chat');
    const unread = !rs[c.id] || new Date(c.last_message_at) > new Date(rs[c.id]);
    return `
      <div class="convo-item ${c.id === currentConvId ? 'active' : ''}" data-id="${c.id}">
        ${unread && c.id !== currentConvId ? '<span class="dot-unread" title="Unread"></span>' : ''}
        <div class="top">
          <span class="name">${escapeHtml(name)}</span>
          <span class="time">${time}</span>
        </div>
        <div class="preview">${escapeHtml(preview)}</div>
        <span class="status ${c.status}">${c.status.replace('_', ' ')}</span>
      </div>
    `;
  }).join('');
  list.querySelectorAll('.convo-item').forEach((el) => {
    el.addEventListener('click', () => openConversation(el.dataset.id));
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      openContextMenu(e.clientX, e.clientY, el.dataset.id);
    });
  });
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ── Open a conversation ──
async function openConversation(id) {
  currentConvId = id;
  const conv = conversations.find((c) => c.id === id);
  if (!conv) return;
  markRead(id, conv.last_message_at);
  $('chat-header').style.display = 'flex';
  $('reply-wrap').style.display = 'flex';
  $('chat-name').textContent = conv.visitor_name || conv.visitor_email || 'Anonymous';
  const metaParts = [];
  if (conv.visitor_company) metaParts.push(conv.visitor_company);
  if (conv.visitor_email) metaParts.push(conv.visitor_email);
  if (conv.page_url) metaParts.push(conv.page_url);
  $('chat-meta').textContent = metaParts.join(' · ') || 'no details';
  $('app').classList.add('view-chat');

  renderConvoList();

  try {
    const data = await rpc({ action: 'admin_messages', conversation_id: id });
    renderMessages(data.messages || []);
  } catch (e) {
    console.error(e);
  }
}

function renderMessages(messages) {
  const body = $('chat-body');
  if (!messages.length) {
    body.innerHTML = '<div class="empty-state">No messages yet</div>';
    return;
  }
  const labelFor = (r) => r === 'user' ? 'Visitor' : r === 'human' ? 'You' : 'System';
  let html = '<div class="chat-scroll">';
  let lastRole = null;
  messages.forEach((m) => {
    if (m.role !== lastRole) {
      html += `<div class="role-label ${m.role}">${labelFor(m.role)}</div>`;
      lastRole = m.role;
    }
    const time = new Date(m.created_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    const textPart = m.content ? `<div>${escapeHtml(m.content)}</div>` : '';
    let attachPart = '';
    if (m.attachment_url) {
      const isImg = (m.attachment_type || '').startsWith('image/');
      if (isImg) {
        attachPart = `<a href="${escapeHtml(m.attachment_url)}" target="_blank" rel="noopener"><img class="attach-img" src="${escapeHtml(m.attachment_url)}" alt="${escapeHtml(m.attachment_name || '')}" loading="lazy" /></a>`;
      } else {
        attachPart = `<a class="attach-link" href="${escapeHtml(m.attachment_url)}" target="_blank" rel="noopener">📎 ${escapeHtml(m.attachment_name || 'attachment')}</a>`;
      }
    }
    html += `<div class="msg ${m.role}">${textPart}${attachPart}<div class="msg-meta">${time}</div></div>`;
  });
  html += '</div>';
  body.innerHTML = html;
  body.scrollTop = body.scrollHeight;
}

// ── Send reply ──
$('send-btn').addEventListener('click', sendReply);
$('reply-input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); } });
$('reply-input').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
});

async function sendReply() {
  const text = $('reply-input').value.trim();
  if (!text || !currentConvId) return;
  $('send-btn').disabled = true;
  try {
    await rpc({ action: 'admin_reply', conversation_id: currentConvId, message: text });
    $('reply-input').value = '';
    $('reply-input').style.height = 'auto';
    await openConversation(currentConvId);
    await loadConversations();
  } catch (e) {
    alert('Failed to send: ' + e.message);
  } finally {
    $('send-btn').disabled = false;
  }
}

// File upload from admin
$('attach-btn').addEventListener('click', () => $('reply-file').click());
$('reply-file').addEventListener('change', async () => {
  const input = $('reply-file');
  const file = input.files && input.files[0];
  if (!file || !currentConvId) return;
  input.value = '';
  if (file.size > 5 * 1024 * 1024) { alert('File too large (max 5MB)'); return; }
  $('attach-btn').disabled = true;
  try {
    const b64 = await fileToBase64(file);
    await rpc({
      action: 'upload_file',
      conversation_id: currentConvId,
      filename: file.name,
      content_type: file.type || 'application/octet-stream',
      file_base64: b64,
      sender: 'human',
    });
    await openConversation(currentConvId);
    await loadConversations();
  } catch (e) {
    alert('Upload failed: ' + e.message);
  } finally {
    $('attach-btn').disabled = false;
  }
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result || '';
      const comma = result.indexOf(',');
      resolve(comma >= 0 ? result.slice(comma + 1) : result);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── Close conversation ──
$('close-btn').addEventListener('click', async () => {
  if (!currentConvId || !confirm('Mark this conversation as closed?')) return;
  await rpc({ action: 'admin_close', conversation_id: currentConvId });
  await loadConversations();
});

$('delete-btn').addEventListener('click', async () => {
  if (!currentConvId || !confirm('Delete this conversation forever? This cannot be undone.')) return;
  try {
    await rpc({ action: 'admin_delete', conversation_id: currentConvId });
    currentConvId = null;
    $('chat-header').style.display = 'none';
    $('reply-wrap').style.display = 'none';
    $('chat-body').innerHTML = '<div class="empty-state">Select a conversation to reply</div>';
    $('app').classList.remove('view-chat');
    await loadConversations();
  } catch (e) {
    alert('Failed to delete: ' + e.message);
  }
});

// ── Back button (mobile) ──
$('back-btn').addEventListener('click', () => {
  $('app').classList.remove('view-chat');
  currentConvId = null;
});

// ── Refresh ──
$('refresh-btn').addEventListener('click', () => loadConversations());

// ── Filter tabs ──
document.querySelectorAll('.filter-tabs button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-tabs button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderConvoList();
  });
});

// ── Auto-refresh every 8s for quicker visibility of new chats ──
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    await loadConversations();
    if (currentConvId) {
      const data = await rpc({ action: 'admin_messages', conversation_id: currentConvId });
      renderMessages(data.messages || []);
    }
  }, 8000);
}

// ── Right-click context menu ──
let ctxTargetId = null;
const ctxMenu = $('ctx-menu');

function openContextMenu(x, y, id) {
  ctxTargetId = id;
  ctxMenu.classList.add('active');
  // Keep within viewport
  const rect = ctxMenu.getBoundingClientRect();
  const maxX = window.innerWidth - 200;
  const maxY = window.innerHeight - 180;
  ctxMenu.style.left = Math.min(x, maxX) + 'px';
  ctxMenu.style.top = Math.min(y, maxY) + 'px';
}
function closeContextMenu() {
  ctxMenu.classList.remove('active');
  ctxTargetId = null;
}

document.addEventListener('click', (e) => {
  if (!ctxMenu.contains(e.target)) closeContextMenu();
});
document.addEventListener('contextmenu', (e) => {
  if (!e.target.closest('.convo-item')) closeContextMenu();
});
window.addEventListener('scroll', closeContextMenu, true);
window.addEventListener('resize', closeContextMenu);

ctxMenu.querySelectorAll('button').forEach((btn) => {
  btn.addEventListener('click', async () => {
    const act = btn.dataset.act;
    const id = ctxTargetId;
    closeContextMenu();
    if (!id) return;

    if (act === 'open') {
      openConversation(id);
      return;
    }
    if (act === 'read') {
      const conv = conversations.find((c) => c.id === id);
      markRead(id, (conv && conv.last_message_at) || new Date().toISOString());
      renderConvoList();
      return;
    }
    if (act === 'close') {
      try {
        await rpc({ action: 'admin_close', conversation_id: id });
        await loadConversations();
      } catch (e) { alert('Failed: ' + e.message); }
      return;
    }
    if (act === 'delete') {
      if (!confirm('Delete this conversation forever? This cannot be undone.')) return;
      try {
        await rpc({ action: 'admin_delete', conversation_id: id });
        if (currentConvId === id) {
          currentConvId = null;
          $('chat-header').style.display = 'none';
          $('reply-wrap').style.display = 'none';
          $('chat-body').innerHTML = '<div class="empty-state">Select a conversation to reply</div>';
          $('app').classList.remove('view-chat');
        }
        await loadConversations();
      } catch (e) { alert('Failed: ' + e.message); }
      return;
    }
  });
});

// ── Theme + text size controls ──
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('ae_admin_theme', t);
}
function setFontScale(s) {
  const clamped = Math.max(0.8, Math.min(1.4, s));
  document.documentElement.style.setProperty('--font-scale', clamped);
  localStorage.setItem('ae_admin_font_scale', clamped);
}
$('theme-toggle').addEventListener('click', () => {
  const curr = document.documentElement.getAttribute('data-theme') || 'dark';
  setTheme(curr === 'dark' ? 'light' : 'dark');
});
$('font-bigger').addEventListener('click', () => {
  const curr = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-scale')) || 1;
  setFontScale(curr + 0.1);
});
$('font-smaller').addEventListener('click', () => {
  const curr = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-scale')) || 1;
  setFontScale(curr - 0.1);
});
$('font-reset').addEventListener('click', () => setFontScale(1));

// ── Deep link support ──
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('conversation')) {
  const deepLinkId = urlParams.get('conversation');
  setTimeout(() => { if (conversations.length) openConversation(deepLinkId); }, 500);
}
